<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자소서 AI 티 검사</title>
<meta name="description" content="자소서를 붙여넣으면 추상어 밀도, 구체성, 실패 언급 세 가지로 채점하고 문제가 된 표현에 형광펜을 긋습니다.">
<style>
/* ===================================================================
   디자인 토큰
   =================================================================== */
:root{
  --paper:#F4F5F1;        /* 배경: 원고지 느낌의 밝은 종이색 */
  --card:#FFFFFF;
  --ink:#17191C;          /* 본문 글자 */
  --ink-soft:#5F6560;     /* 보조 글자 */
  --rule:#E2E4DC;         /* 얇은 구분선 */
  --rule-strong:#CFD2C8;

  --mark-abstract:#FFE86B; /* 형광펜: 추상 명사(노랑) */
  --mark-failure:#A8E6CF;  /* 형광펜: 실패·솔직함(민트) */
  --mark-concrete:#A9D8FF; /* 형광펜: 숫자·고유명사(하늘) */

  --good:#1F8A54;         /* 낮은 점수 = 사람 티 */
  --warn:#C97A0B;
  --bad:#CE3B36;          /* 높은 점수 = AI 티 */

  --serif:"Nanum Myeongjo","Apple Myungjo","AppleMyungjo",Batang,"Noto Serif KR",serif;
  --sans:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:40px 20px 80px}

/* ===================================================================
   헤더
   =================================================================== */
.eyebrow{
  font-size:12px;letter-spacing:.22em;color:var(--ink-soft);
  text-transform:uppercase;margin:0 0 14px;
}
h1{
  font-family:var(--serif);
  font-size:clamp(30px,7.5vw,44px);
  line-height:1.25;font-weight:700;margin:0 0 12px;
  word-break:keep-all;
}
.lede{margin:0 0 32px;color:var(--ink-soft);font-size:15px;word-break:keep-all}

/* ===================================================================
   입력 영역 — 한 장의 원고지처럼
   =================================================================== */
.sheet{
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:6px;
  overflow:hidden;
}
textarea{
  display:block;width:100%;border:0;resize:vertical;
  padding:20px;min-height:280px;
  font-family:var(--sans);font-size:16px;line-height:2;
  color:var(--ink);background:transparent;
  /* 원고지 느낌의 옅은 밑줄 */
  background-image:repeating-linear-gradient(
    to bottom, transparent 0, transparent 31px, #F0F1EC 31px, #F0F1EC 32px);
  background-attachment:local;
}
textarea:focus{outline:none}
.sheet:focus-within{border-color:var(--rule-strong);box-shadow:0 0 0 3px rgba(23,25,28,.06)}
.sheet-foot{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 16px;border-top:1px solid var(--rule);
  font-size:13px;color:var(--ink-soft);
}
.linkish{
  background:none;border:0;padding:0;cursor:pointer;
  font:inherit;color:var(--ink-soft);text-decoration:underline;
  text-underline-offset:3px;
}
.linkish:hover{color:var(--ink)}

.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{
  font-family:var(--sans);font-size:16px;font-weight:600;
  padding:14px 28px;border-radius:4px;cursor:pointer;
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  transition:transform .12s ease, opacity .12s ease;
}
.btn:hover{opacity:.88}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.notice{
  margin-top:14px;font-size:14px;color:var(--bad);
}
.notice[hidden]{display:none}

/* ===================================================================
   결과
   =================================================================== */
#result{margin-top:48px}
#result[hidden]{display:none}

.score-card{
  background:var(--card);border:1px solid var(--rule);border-radius:6px;
  padding:28px 24px;text-align:center;
}
.score-label{font-size:13px;letter-spacing:.14em;color:var(--ink-soft);margin:0}
.score-num{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:clamp(72px,22vw,108px);line-height:1;font-weight:700;
  margin:8px 0 4px;letter-spacing:-.03em;
}
.score-num span{font-size:.3em;font-weight:500;color:var(--ink-soft);margin-left:4px}
.verdict{font-family:var(--serif);font-size:19px;margin:0 0 20px;word-break:keep-all}
.gauge{height:8px;background:#EDEFE9;border-radius:99px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}

h2.sec{
  font-family:var(--serif);font-size:15px;font-weight:700;
  margin:40px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule-strong);
}

.item{
  background:var(--card);border:1px solid var(--rule);border-radius:6px;
  padding:20px;margin-bottom:12px;
}
.item-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.item-name{font-weight:700;font-size:16px;margin:0}
.item-score{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.bar{height:5px;background:#EDEFE9;border-radius:99px;margin:12px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.item p{margin:0 0 10px;font-size:15px;word-break:keep-all}
.advice{
  margin:0;font-size:14px;color:var(--ink-soft);
  border-left:2px solid var(--rule-strong);padding-left:12px;word-break:keep-all;
}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{
  font-size:13px;padding:2px 8px;border-radius:3px;background:#F1F2EC;
  font-family:var(--mono);
}
.chip b{font-weight:600}

/* 형광펜 — 밑에서 45%만 칠해 실제로 펜을 그은 것처럼 */
.mk{border-radius:2px;padding:0 1px}
.mk-abstract{background:linear-gradient(180deg,transparent 52%,var(--mark-abstract) 52%)}
.mk-failure{background:linear-gradient(180deg,transparent 52%,var(--mark-failure) 52%)}
.mk-concrete{background:linear-gradient(180deg,transparent 52%,var(--mark-concrete) 52%)}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-soft);margin-bottom:12px}
.legend i{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}

.marked{
  background:var(--card);border:1px solid var(--rule);border-radius:6px;
  padding:22px 20px 22px 22px;border-left:3px solid var(--rule-strong);
  white-space:pre-wrap;word-break:keep-all;line-height:2.1;font-size:15px;
}

footer{margin-top:56px;font-size:13px;color:var(--ink-soft);word-break:keep-all}

@media (max-width:480px){
  .wrap{padding:28px 16px 64px}
  .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">자소서 첨삭</p>
    <h1>이 자소서, AI가 쓴 티가 날까</h1>
    <p class="lede">자소서를 붙여넣으면 추상어 밀도, 구체성, 실패 언급 세 가지로 채점하고 문제가 된 표현에 형광펜을 긋습니다. 입력한 글은 브라우저 밖으로 나가지 않습니다.</p>
  </header>

  <main>
    <div class="sheet">
      <label for="input" class="sr-only" style="position:absolute;left:-9999px">자소서 본문</label>
      <textarea id="input" rows="12" placeholder="여기에 자소서를 붙여넣으세요."></textarea>
      <div class="sheet-foot">
        <span id="counter">0자 · 0단어</span>
        <span>
          <button type="button" class="linkish" id="sampleBtn">예시 넣기</button>
        </span>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn" id="checkBtn">검사하기</button>
      <button type="button" class="btn ghost" id="clearBtn">지우기</button>
    </div>
    <p class="notice" id="notice" hidden></p>

    <section id="result" hidden aria-live="polite">
      <div class="score-card">
        <p class="score-label">AI 티 지수</p>
        <p class="score-num" id="totalScore">0<span>/100</span></p>
        <p class="verdict" id="verdict"></p>
        <div class="gauge"><i id="totalBar"></i></div>
      </div>

      <h2 class="sec">항목별 점수</h2>
      <div id="items"></div>

      <h2 class="sec">첨삭본</h2>
      <div class="legend">
        <span><i style="background:var(--mark-abstract)"></i>추상 명사</span>
        <span><i style="background:var(--mark-concrete)"></i>숫자·고유명사</span>
        <span><i style="background:var(--mark-failure)"></i>실패·솔직한 표현</span>
      </div>
      <div class="marked" id="marked"></div>
    </section>
  </main>

  <footer>
    통계적인 어림짐작일 뿐, AI 작성 여부를 증명하지는 못합니다. 점수를 낮추는 것보다 실제 경험을 더 적는 쪽이 언제나 낫습니다.
  </footer>
</div>

<script>
/* ===================================================================
   1. 판별 기준 단어 목록 — 여기만 고치면 검사 기준이 바뀝니다
   =================================================================== */

// (1) 추상 명사: 많을수록 AI 의심
const ABSTRACT_WORDS = [
  "역량","기여","성장","열정","도전","협업","소통","노력","자세","마음가짐",
  "원동력","밑거름","책임감","적극적","능동적","지속적","다양한","경험을 통해",
  "가치관","비전","시너지","잠재력","전문성","경쟁력","글로벌","인재",
  "최선을 다","끊임없이","바탕으로","발판","초석","자부심","신뢰","헌신"
];

// (2) 실패·솔직함을 드러내는 표현: 하나도 없으면 AI 의심
const FAILURE_WORDS = [
  "실패","못했","어려웠","아쉬","힘들었","부족했","몰랐","막막","헤맸",
  "틀렸","놓쳤","실수","좌절","포기","시행착오","반려","탈락","깨졌","무너"
];

// (3) 구체성 지표를 찾는 정규식: 숫자(단위 포함)와 영문 고유명사
const NUMBER_RE  = /\d+(?:[.,]\d+)*\s*(?:%|퍼센트|명|개월|개|주|일|년|회|차|건|위|배|시간|분|점|만|천|억|원|kg|km|등|학년|주차|기)?/g;
const PROPER_RE  = /[A-Za-z][A-Za-z0-9+#._-]{1,}/g;

// 점수 기준값 — 감이 안 맞으면 이 숫자들을 조정하세요
const ABSTRACT_MAX_RATIO = 0.05;  // 전체 단어의 5% 이상이 추상어면 100점
const CONCRETE_TARGET    = 4;     // 100단어당 구체 표현 4개면 0점(=사람 티)
const WEIGHTS = { abstract: 0.40, concrete: 0.35, failure: 0.25 };

/* ===================================================================
   2. 유틸
   =================================================================== */
const $ = (id) => document.getElementById(id);
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

// HTML 특수문자 이스케이프 (원문을 그대로 그릴 때 필수)
function escapeHtml(s){
  return s.replace(/[&<>"']/g, (c) => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

// 단어 수: 공백 기준
function countWords(text){
  const t = text.trim();
  return t ? t.split(/\s+/).length : 0;
}

/* ===================================================================
   3. 원문 스캔 — 모든 표시 대상을 한 번에 수집
   =================================================================== */
function scan(text){
  const marks = [];

  // 단어 목록을 원문에서 모두 찾아 위치 기록
  const collect = (list, type) => {
    list.forEach((w) => {
      let i = text.indexOf(w);
      while (i !== -1){
        marks.push({ start:i, end:i + w.length, type, text:w });
        i = text.indexOf(w, i + w.length);
      }
    });
  };
  collect(ABSTRACT_WORDS, "abstract");
  collect(FAILURE_WORDS,  "failure");

  // 정규식으로 숫자·영문 수집
  const collectRe = (re, type) => {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null){
      const raw = m[0].trim();
      if (raw.length) marks.push({ start:m.index, end:m.index + raw.length, type, text:raw });
      if (m.index === re.lastIndex) re.lastIndex++; // 무한 루프 방지
    }
  };
  collectRe(NUMBER_RE, "concrete");
  collectRe(PROPER_RE, "concrete");

  // 겹치는 구간 정리: 앞에서부터, 같은 위치면 긴 쪽을 남김
  marks.sort((a,b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const clean = [];
  let cursor = -1;
  marks.forEach((m) => {
    if (m.start >= cursor){ clean.push(m); cursor = m.end; }
  });
  return clean;
}

// 표시 대상을 종류별로 세고, 단어별 빈도도 함께 집계
function tally(marks, type){
  const freq = new Map();
  let total = 0;
  marks.forEach((m) => {
    if (m.type !== type) return;
    total++;
    freq.set(m.text, (freq.get(m.text) || 0) + 1);
  });
  const top = [...freq.entries()].sort((a,b) => b[1] - a[1]);
  return { total, top };
}

/* ===================================================================
   4. 채점
   =================================================================== */
function grade(text){
  const marks = scan(text);
  const words = countWords(text);

  const abstract = tally(marks, "abstract");
  const failure  = tally(marks, "failure");
  const concrete = tally(marks, "concrete");

  // (1) 추상 명사 밀도
  const ratio = words ? abstract.total / words : 0;
  const abstractScore = Math.round(clamp(ratio / ABSTRACT_MAX_RATIO, 0, 1) * 100);

  // (2) 구체성 — 100단어당 숫자·고유명사 개수. 많을수록 점수가 내려감
  const per100 = words ? (concrete.total / words) * 100 : 0;
  const concreteScore = Math.round(clamp(1 - per100 / CONCRETE_TARGET, 0, 1) * 100);

  // (3) 실패 언급 — 없으면 만점(=가장 AI스러움)
  const failTable = [100, 55, 32, 18, 8];
  const failureScore = failure.total >= failTable.length ? 0 : failTable[failure.total];

  const total = Math.round(
    abstractScore * WEIGHTS.abstract +
    concreteScore * WEIGHTS.concrete +
    failureScore  * WEIGHTS.failure
  );

  return { marks, words, total, abstract, concrete, failure,
           abstractScore, concreteScore, failureScore, ratio, per100 };
}

/* ===================================================================
   5. 코멘트와 조언
   =================================================================== */
function bandColor(score){
  if (score < 35) return "var(--good)";
  if (score < 65) return "var(--warn)";
  return "var(--bad)";
}

function verdictOf(score){
  if (score < 35) return "사람이 겪은 일의 냄새가 납니다. 이대로 밀고 가세요.";
  if (score < 65) return "군데군데 AI가 쓴 듯한 문장이 섞여 있습니다.";
  return "AI가 뽑아준 문장에 가깝습니다. 크게 손봐야 합니다.";
}

function buildItems(r){
  return [
    {
      name: "추상 명사 밀도",
      score: r.abstractScore,
      chips: r.abstract.top,
      comment: r.abstract.total === 0
        ? "추상어가 거의 없습니다. 문장이 실제 사건 위에 서 있습니다."
        : `추상어 ${r.abstract.total}개 / 전체 ${r.words}단어 = ${(r.ratio*100).toFixed(1)}%.` +
          (r.abstractScore >= 65 ? " 뜻은 좋지만 아무 회사에나 붙는 말이 너무 많습니다."
           : r.abstractScore >= 35 ? " 평균보다 조금 많은 편입니다."
           : " 적당한 수준입니다."),
      advice: "‘소통 역량을 길렀습니다’ 같은 문장은 그 역량을 쓴 장면으로 바꾸세요. 누구와, 무슨 갈등을, 어떤 말로 풀었는지 한 문장만 넣어도 추상어 세 개가 사라집니다."
    },
    {
      name: "구체성",
      score: r.concreteScore,
      chips: r.concrete.top,
      comment: `숫자·고유명사 ${r.concrete.total}개, 100단어당 ${r.per100.toFixed(1)}개.` +
        (r.concreteScore >= 65 ? " 검증할 수 있는 정보가 거의 없습니다."
         : r.concreteScore >= 35 ? " 조금 더 넣을 여지가 있습니다."
         : " 읽는 사람이 확인할 수 있는 정보가 충분합니다."),
      advice: "인원, 기간, 규모, 도구 이름을 적으세요. ‘팀 프로젝트를 진행하며’보다 ‘4명이 6주 동안 Figma로’가 훨씬 사람의 기억처럼 읽힙니다."
    },
    {
      name: "실패 언급",
      score: r.failureScore,
      chips: r.failure.top,
      comment: r.failure.total === 0
        ? "잘 안 풀린 이야기가 한 번도 나오지 않습니다. 전 과정이 성공으로만 채워진 글은 지어낸 티가 납니다."
        : `솔직한 표현 ${r.failure.total}군데를 찾았습니다. 굴곡이 보이는 글입니다.`,
      advice: "막혔던 지점을 한 문단 넣고, 그때 무엇을 바꿨는지로 이어가세요. 실패는 감점 요인이 아니라 그 경험이 진짜라는 증거입니다."
    }
  ];
}

/* ===================================================================
   6. 화면 그리기
   =================================================================== */
function renderMarked(text, marks){
  let html = "";
  let pos = 0;
  marks.forEach((m) => {
    html += escapeHtml(text.slice(pos, m.start));
    html += `<span class="mk mk-${m.type}">${escapeHtml(text.slice(m.start, m.end))}</span>`;
    pos = m.end;
  });
  html += escapeHtml(text.slice(pos));
  return html;
}

function render(r, text){
  // 종합 점수
  const color = bandColor(r.total);
  $("totalScore").innerHTML = `${r.total}<span>/100</span>`;
  $("totalScore").style.color = color;
  $("verdict").textContent = verdictOf(r.total);
  $("totalBar").style.background = color;
  $("totalBar").style.width = "0%";

  // 항목별 카드
  $("items").innerHTML = buildItems(r).map((it) => {
    const c = bandColor(it.score);
    const chips = it.chips.length
      ? `<p class="chips">${it.chips.slice(0, 12).map(([w,n]) =>
          `<span class="chip">${escapeHtml(w)}${n > 1 ? ` <b>×${n}</b>` : ""}</span>`).join("")}</p>`
      : "";
    return `
      <div class="item">
        <div class="item-head">
          <p class="item-name">${it.name}</p>
          <span class="item-score" style="color:${c}">${it.score}</span>
        </div>
        <div class="bar"><i data-w="${it.score}" style="background:${c}"></i></div>
        <p>${it.comment}</p>
        ${chips}
        <p class="advice">${it.advice}</p>
      </div>`;
  }).join("");

  // 첨삭본
  $("marked").innerHTML = renderMarked(text, r.marks);

  $("result").hidden = false;

  // 게이지는 그린 뒤에 채워서 움직임이 보이게 함
  requestAnimationFrame(() => {
    $("totalBar").style.width = r.total + "%";
    document.querySelectorAll(".bar i").forEach((el) => {
      el.style.width = el.dataset.w + "%";
    });
  });
}

/* ===================================================================
   7. 이벤트
   =================================================================== */
const input = $("input");

function updateCounter(){
  const t = input.value;
  $("counter").textContent =
    `${t.length.toLocaleString()}자 · ${countWords(t).toLocaleString()}단어`;
}
input.addEventListener("input", updateCounter);

function showNotice(msg){
  const n = $("notice");
  n.textContent = msg;
  n.hidden = !msg;
}

$("checkBtn").addEventListener("click", () => {
  const text = input.value.trim();
  if (!text){
    showNotice("검사할 글이 없습니다. 자소서를 붙여넣고 다시 눌러 주세요.");
    $("result").hidden = true;
    input.focus();
    return;
  }
  if (text.length < 100){
    showNotice("글이 100자보다 짧으면 밀도 계산이 흔들립니다. 참고용으로만 보세요.");
  } else {
    showNotice("");
  }
  render(grade(text), text);
  $("result").scrollIntoView({ behavior:"smooth", block:"start" });
});

$("clearBtn").addEventListener("click", () => {
  input.value = "";
  updateCounter();
  showNotice("");
  $("result").hidden = true;
  input.focus();
});
